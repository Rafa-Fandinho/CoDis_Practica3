plugins {
    id 'java'
    id 'application'
}

group 'org.example'
version '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.cxf:cxf-rt-frontend-jaxws:3.3.5'
    implementation 'org.apache.cxf:cxf-rt-transports-http-jetty:3.3.5'
    implementation 'com.sun.xml.ws:jaxws-ri:2.3.2'
    implementation 'com.sun.activation:jakarta.activation:1.2.2'
}

// A tarefa "run" executa o servidor por defecto.
application {
    mainClass = 'gal.usc.etse.soap.Server'
}

// Tarefa específica para o servidor.
tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Inicia os servizos SOAP.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'gal.usc.etse.soap.Server'
}

// Tarefa específica para o cliente.
tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Inicia o cliente interactivo SOAP.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'gal.usc.etse.soap.Client'
    standardInput = System.in
}